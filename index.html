<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Завод Нева — КП</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--bg4:#2a2f45;
  --accent:#6c63ff;--accent2:#a89fff;--accentDim:#2d2a5e;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;
  --text:#f0f0f0;--text2:#a0a4b8;--text3:#5a5f7a;
  --border:#2a2f45;--radius:12px;--card:#1e2235;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
#scroll-root{height:100vh;overflow-y:auto;padding:12px 12px 80px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back-btn{background:var(--bg3);border:none;color:var(--text2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.header h2{font-size:16px;font-weight:700;flex:1}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none}
.field input:focus,.field select,.field textarea:focus{border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{width:100%;padding:13px;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--bg3);color:var(--text)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.type-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.type-card{background:var(--bg3);border:2px solid transparent;border-radius:var(--radius);padding:12px 8px;text-align:center;cursor:pointer;transition:.15s}
.type-card.selected{border-color:var(--accent);background:var(--accentDim)}
.type-card-name{font-weight:700;font-size:15px;margin-bottom:4px}
.type-card-icon{font-size:24px;margin-bottom:6px}
.type-card-sub{font-size:11px;color:var(--text2)}
.section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 8px}
.divider{height:1px;background:var(--border);margin:14px 0}
.mat-card{background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s;border:2px solid transparent}
.mat-card:hover{border-color:var(--accent)}
.mat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.mat-info{flex:1;min-width:0}
.mat-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat-sub{font-size:11px;color:var(--text2);margin-top:2px}
.mat-price{font-weight:700;color:var(--success);font-size:13px;flex-shrink:0}
.layer-card{background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:8px;position:relative}
.layer-name{font-weight:600;margin-bottom:4px}
.layer-detail{font-size:12px;color:var(--text2)}
.layer-total{font-weight:700;color:var(--success);font-size:14px;margin-top:4px}
.icon-btn{width:28px;height:28px;border-radius:6px;border:none;background:var(--bg4);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.icon-btn:hover{background:var(--danger);color:#fff}
.icon-btn.move:hover{background:var(--accent);color:#fff}
.zone-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;border:2px solid transparent;transition:.15s}
.zone-card:hover{border-color:var(--accent)}
.zone-head{display:flex;align-items:flex-start;gap:8px}
.zone-info{flex:1}
.zone-title{font-weight:700;font-size:15px;margin-bottom:2px}
.zone-sub{font-size:12px;color:var(--text2)}
.zone-total{font-weight:700;color:var(--success);font-size:15px}
.zone-controls{display:flex;flex-direction:column;gap:3px}
.chip-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{background:var(--bg3);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--text2)}
.search-box{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;width:100%;outline:none;margin-bottom:10px}
.total-card{background:var(--accentDim);border-radius:var(--radius);padding:14px;margin-bottom:10px;text-align:center}
.total-big{font-size:28px;font-weight:700;color:var(--accent2)}
.total-sub{font-size:12px;color:var(--text2);margin-top:4px}
#snack{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;transition:.3s;opacity:0;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#snack.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{background:var(--bg3);border:2px solid transparent;border-radius:20px;padding:6px 14px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.cat-tab.active{border-color:var(--accent);color:var(--accent2)}
.empty{text-align:center;color:var(--text3);padding:40px 0;font-size:13px}
.proposal-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;border:2px solid transparent;transition:.15s}
.proposal-card:hover{border-color:var(--accent)}
.proposal-name{font-weight:700;font-size:15px}
.proposal-meta{font-size:12px;color:var(--text2);margin-top:4px}
.proposal-total{font-weight:700;color:var(--success);font-size:16px;margin-top:6px}
.result-zone{background:var(--bg3);border-radius:10px;margin-bottom:10px;overflow:hidden}
.result-zone-head{padding:10px 14px;background:var(--bg4);font-weight:700}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border)}
.result-row:last-child{border-bottom:none}
.result-label{font-size:13px;flex:1}
.result-val{font-weight:700;font-size:13px;color:var(--success)}
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;padding:20px}
.pin-logo{font-size:48px;margin-bottom:8px}
.pin-title{font-size:20px;font-weight:700;text-align:center}
.pin-sub{font-size:13px;color:var(--text2);text-align:center}
.pin-input{background:var(--bg3);border:2px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:20px;text-align:center;letter-spacing:8px;width:100%;max-width:280px;outline:none}
.pin-input:focus{border-color:var(--accent)}
</style>
</head>
<body>
<div id="scroll-root"><div id="root"></div></div>
<div id="snack"></div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const API = 'https://nonconversationally-vestibular-pia.ngrok-free.app';
const PIN_KEY = 'zavod_pin_v2';
const SK = 'zavod_neva_v3';

// ===== STATE =====
const state = {
  screen:'pin',
  pin:'',
  userId: tg?.initDataUnsafe?.user?.id?.toString() || 'web_user',
  catalog:[],
  proposals:[],
  kp:{name:'',info:'',note:'',delivery:0,zones:[]},
  currentZoneIdx:null,
  editingProposalId:null,
  viewProposal:null,
  addLayerCategory:'primer',
  addLayerSearch:'',
  editProduct:null,
  customForm:{unit:'kg',comp:'1c'},
};
let catalogDirty=false;

// ===== STORAGE =====
function load(){try{const d=localStorage.getItem(SK);return d?JSON.parse(d):null}catch{return null}}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s))}catch{}}
function persist(){save({catalog:state.catalog,proposals:state.proposals})}

// ===== SYNC =====
async function syncWithServer(initialLoad=false){
  const pin=localStorage.getItem(PIN_KEY)||state.pin;
  if(!pin)return;
  try{
    const body={
      pin, user_id:state.userId,
      catalog: catalogDirty ? state.catalog : [],
      proposals: initialLoad ? [] : state.proposals,
    };
    const r=await fetch(`${API}/sync`,{
      method:'POST',
      headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
      body:JSON.stringify(body)
    });
    if(!r.ok)return;
    const data=await r.json();
    if(data.catalog && data.catalog.length>0){state.catalog=data.catalog;}
    if(data.proposals){state.proposals=data.proposals;}
    catalogDirty=false;
    persist();
    render();
  }catch(e){console.warn('sync:',e);}
}

// ===== HELPERS =====
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function fmtRub(n){return(Math.round(n)||0).toLocaleString('ru-RU')+'₽'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function show(msg){const el=document.getElementById('snack');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2500)}
function nav(screen,extra={}){state.screen=screen;Object.assign(state,extra);render();document.getElementById('scroll-root').scrollTop=0}
function on(id,fn){const el=document.getElementById(id);if(el)el.addEventListener('click',fn)}
function currentZone(){return state.kp.zones[state.currentZoneIdx]??null}

// ===== CATEGORY LABELS =====
const CAT_LABEL={primer:'Грунт',enamel:'Эмаль',lacquer:'Лак',primer_enamel:'Грунт-эмаль',water_emulsion:'Водоэмульсия',thinner:'Разбавитель',custom:'Прочее'};
const CAT_COLORS={primer:'#e67e22',enamel:'#3498db',lacquer:'#9b59b6',primer_enamel:'#1abc9c',water_emulsion:'#2ecc71',thinner:'#95a5a6',custom:'#7f8c8d'};
const CATS=Object.keys(CAT_LABEL);

// ===== CALC =====
function calcLayer(layer,area){
  const p=state.catalog.find(c=>c.id===layer.productId)||{};
  const unit=layer.customUnit||p.unit||'kg';
  const isL=unit==='l';
  const comp=layer.customComp||p.comp||'1c';
  const is2c=comp==='2c';
  const price=layer.customPrice??p.price??0;
  const cons=layer.customConsumption??p.consumption??0;
  const layers=parseFloat(layer.layers)||1;
  const container=layer.customContainer??p.container??25;
  const base=layer.customBase??p.base??container;
  const hardener=layer.customHardener??p.hardener??0;
  const name=layer.customName||p.name||'—';
  const fullName=layer.customFullName||p.fullName||name;
  const color=layer.customColor||p.color||'';
  const cat=layer.category||p.category||'custom';

  // Режим СПИСКОМ — area===null
  if(area===null){
    const needed=layer.neededAmount||0; // уже кг/л
    if(!is2c){
      const packs=container>0?Math.ceil(needed/container):1;
      const total_weight=packs*container;
      const total=packs*container*price;
      return {name,fullName,color,cat,unit,comp,layers,packs,total_weight,total,container,
        detail:`${packs} шт × ${container}${isL?'л':'кг'} = ${total_weight}${isL?'л':'кг'}`};
    } else {
      const comps=base>0?Math.ceil(needed/base):1;
      const total_weight=comps*(base+hardener);
      const total=comps*(base+hardener)*price;
      return {name,fullName,color,cat,unit,comp,layers,packs:comps,total_weight,total,
        container:base,hardener,
        detail:`${comps} компл × ${base+hardener}кг = ${total_weight}кг`};
    }
  }

  // Режим ПО ПЛОЩАДИ
  const totalCons=cons*layers*(isL?0.001:0.001)*area; // г/м²→кг или мл/м²→л * area
  const rawAmount=(cons*layers/1000)*area;
  if(!is2c){
    const packs=container>0?Math.ceil(rawAmount/container):1;
    const total_weight=packs*container;
    const total=total_weight*price;
    return {name,fullName,color,cat,unit,comp,layers,packs,total_weight,total,container,
      detail:`${packs} шт × ${container}${isL?'л':'кг'} = ${total_weight}${isL?'л':'кг'}`};
  } else {
    const comps=base>0?Math.ceil(rawAmount/base):1;
    const total_weight=comps*(base+hardener);
    const total=comps*(base+hardener)*price;
    return {name,fullName,color,cat,unit,comp,layers,packs:comps,total_weight,total,
      container:base,hardener,
      detail:`${comps} компл × ${base+hardener}кг = ${total_weight}кг`};
  }
}

function calcZone(zone){
  const area=zone.mode==='list'?null:(parseFloat(zone.area)||0);
  let total=0,layers=[];
  for(const l of zone.layers){
    const r=calcLayer(l,area);
    total+=r.total;
    layers.push(r);
  }
  const pricePerM2=area?total/area:0;
  return{total,layers,area,pricePerM2};
}

function calcKP(){
  let total=0;const zones=[];
  for(const z of state.kp.zones){
    const r=calcZone(z);
    total+=r.total;
    zones.push({...r,name:z.name});
  }
  total+=parseFloat(state.kp.delivery)||0;
  return{total,zones,delivery:parseFloat(state.kp.delivery)||0};
}

// ===== RENDER =====
function render(){
  const root=document.getElementById('root');
  switch(state.screen){
    case 'pin':       root.innerHTML=renderPin();break;
    case 'home':      root.innerHTML=renderHome();break;
    case 'kp_start':  root.innerHTML=renderKPStart();break;
    case 'kp_zones':  root.innerHTML=renderKPZones();break;
    case 'kp_add_zone': root.innerHTML=renderAddZone();break;
    case 'kp_build':  root.innerHTML=renderKPBuild();break;
    case 'kp_add_layer': root.innerHTML=renderAddLayer();break;
    case 'kp_result': root.innerHTML=renderKPResult();break;
    case 'proposals': root.innerHTML=renderProposals();break;
    case 'view_proposal': root.innerHTML=renderViewProposal();break;
    case 'catalog':   root.innerHTML=renderCatalog();break;
    case 'edit_product': root.innerHTML=renderEditProduct();break;
    default: root.innerHTML=renderHome();
  }
  attachHandlers();
}

function renderPin(){return`
<div class="pin-screen">
  <div class="pin-logo">🏭</div>
  <div class="pin-title">Завод Нева</div>
  <div class="pin-sub">Введите PIN-код для входа</div>
  <input class="pin-input" id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off">
  <button class="btn btn-primary" id="pin-submit" style="max-width:280px;width:100%">Войти</button>
</div>`}

function renderHome(){return`
<div class="header"><h2>🏭 Завод Нева</h2>
  <button class="btn btn-secondary" id="go-catalog" style="width:auto;padding:8px 14px;font-size:13px">📦 Каталог</button>
</div>
<div class="card" style="text-align:center;padding:20px">
  <div style="font-size:13px;color:var(--text2);margin-bottom:16px">Создайте новое коммерческое предложение</div>
  <button class="btn btn-primary" id="new-kp">+ Новое КП</button>
</div>
${state.proposals.length?`
<div class="section-title">Сохранённые КП (${state.proposals.length})</div>
${state.proposals.map(p=>`
<div class="proposal-card" data-pid="${p.id}">
  <div class="proposal-name">${esc(p.name||'Без названия')}</div>
  <div class="proposal-meta">${new Date(p.date||0).toLocaleDateString('ru-RU')} · ${p.zoneCount||0} зон</div>
  <div class="proposal-total">${fmtRub(p.total)}</div>
</div>`).join('')}`:''}
`}

function renderKPStart(){return`
<div class="header">
  <button class="back-btn" id="back-home">←</button>
  <h2>Новое КП</h2>
</div>
<div class="card">
  <div class="field"><label>Клиент / Название КП</label>
    <input id="kp-name" value="${esc(state.kp.name)}" placeholder="Напр: ООО Ромашка — склад"></div>
  <div class="field"><label>Контакт / Адрес</label>
    <input id="kp-info" value="${esc(state.kp.info||'')}" placeholder="Телефон, адрес объекта"></div>
</div>
<button class="btn btn-primary" id="kp-next">Далее →</button>`}

function renderKPZones(){
  const r=calcKP();
  return`
<div class="header">
  <button class="back-btn" id="back-kp-start">←</button>
  <h2>${esc(state.kp.name||'Новое КП')}${state.editingProposalId?' ✏️':''}</h2>
</div>
${state.kp.zones.length===0?`<div class="empty">Зоны не добавлены.<br>Нажмите «+ Добавить зону»</div>`:''}
${state.kp.zones.map((z,i)=>{
  const zr=calcZone(z);
  const chips=zr.layers.map(l=>`<span class="chip">${esc(l.name)}</span>`).join('');
  return`<div class="zone-card" data-edit-zone="${i}">
    <div class="zone-head">
      <div class="zone-info">
        <div class="zone-title">${esc(z.name||'Зона '+(i+1))}</div>
        <div class="zone-sub">${z.mode==='list'?'Список':''}${z.area?z.area+' м²':''} · ${z.layers.length} поз.</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-weight:700;color:var(--success)">${fmtRub(zr.total)}</div>
        ${z.mode!=='list'&&zr.pricePerM2?`<div style="font-size:11px;color:var(--text3)">${fmtRub(Math.round(zr.pricePerM2))} ₽/м²</div>`:''}
      </div>
      <div class="zone-controls">
        <button class="icon-btn move" data-move-zone="up" data-zone-idx="${i}" style="${i===0?'visibility:hidden':''}">▲</button>
        <button class="icon-btn move" data-move-zone="down" data-zone-idx="${i}" style="${i===state.kp.zones.length-1?'visibility:hidden':''}">▼</button>
      </div>
      <button class="icon-btn" data-del-zone="${i}">✕</button>
    </div>
    <div class="chip-row">${chips}</div>
  </div>`}).join('')}
<button class="btn btn-secondary" id="add-zone" style="margin-bottom:10px">+ Добавить зону</button>
<div class="card">
  <div class="field"><label>Доставка (₽)</label>
    <input id="kp-delivery" type="number" inputmode="decimal" value="${state.kp.delivery||''}" placeholder="0"></div>
  <div class="field"><label>Примечание</label>
    <textarea id="kp-note" rows="2" placeholder="Условия, сроки...">${esc(state.kp.note||'')}</textarea></div>
</div>
${r.total>0?`<div class="total-card">
  <div class="total-big">${fmtRub(r.total)}</div>
  <div class="total-sub">${r.zones.length} зон · ${r.zones.reduce((a,z)=>a+(z.layers?.length||0),0)} позиций</div>
</div>`:''}
<div class="btn-row">
  <button class="btn btn-secondary" id="save-kp">${state.editingProposalId?'💾 Обновить':'💾 Сохранить'}</button>
  <button class="btn btn-success" id="go-result">Итог →</button>
</div>`}

function renderAddZone(){return`
<div class="header">
  <button class="back-btn" id="back-zones">←</button>
  <h2>Новая зона</h2>
</div>
<div class="card">
  <div class="field"><label>Название зоны</label>
    <input id="zone-name" placeholder="Напр: Пол, Стены, Колонны"></div>
</div>
<div class="section-title">Способ формирования системы</div>
<div class="type-grid3">
  <div class="type-card" data-zone-mode="scheme">
    <div class="type-card-icon">🎨</div>
    <div class="type-card-name">Схема</div>
    <div class="type-card-sub">Готовая схема</div>
  </div>
  <div class="type-card" data-zone-mode="build">
    <div class="type-card-icon">🪣</div>
    <div class="type-card-name">Подбор</div>
    <div class="type-card-sub">Слой за слоем</div>
  </div>
  <div class="type-card" data-zone-mode="list">
    <div class="type-card-icon">📋</div>
    <div class="type-card-name">Списком</div>
    <div class="type-card-sub">Без площади</div>
  </div>
</div>`}

function renderKPBuild(){
  const z=currentZone();
  if(!z)return`<button class="btn btn-secondary" id="back-zones">← Назад</button>`;
  const isList=z.mode==='list';
  const zr=calcZone(z);
  return`
<div class="header">
  <button class="back-btn" id="back-zones">←</button>

// ===== ATTACH HANDLERS =====
function attachHandlers(){
  const s=state.screen;

  // PIN
  if(s==='pin'){
    const inp=document.getElementById('pin-input');
    const saved=localStorage.getItem(PIN_KEY);
    if(saved){state.pin=saved;nav('home');syncWithServer(true);return;}
    if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitPin()});
    on('pin-submit',submitPin);
    function submitPin(){
      const v=document.getElementById('pin-input')?.value?.trim();
      if(!v){show('Введите PIN');return;}
      state.pin=v;
      localStorage.setItem(PIN_KEY,v);
      const cached=load();
      if(cached){state.catalog=cached.catalog||[];state.proposals=cached.proposals||[];}
      nav('home');
      syncWithServer(true);
    }
  }

  // HOME
  if(s==='home'){
    on('new-kp',()=>{state.kp={name:'',info:'',note:'',delivery:0,zones:[]};state.editingProposalId=null;nav('kp_start')});
    on('go-catalog',()=>{state.addLayerSearch='';state.addLayerCategory='primer';nav('catalog')});
    document.querySelectorAll('[data-pid]').forEach(el=>{
      el.addEventListener('click',()=>{
        const p=state.proposals.find(x=>x.id===el.dataset.pid);
        if(p)nav('view_proposal',{viewProposal:p});
      });
    });
  }

  // KP START
  if(s==='kp_start'){
    on('back-home',()=>nav('home'));
    on('kp-next',()=>{
      state.kp.name=document.getElementById('kp-name')?.value?.trim()||'';
      state.kp.info=document.getElementById('kp-info')?.value?.trim()||'';
      nav('kp_zones');
    });
  }

  // KP ZONES
  if(s==='kp_zones'){
    on('back-kp-start',()=>nav('kp_start'));
    on('add-zone',()=>nav('kp_add_zone'));
    on('go-result',()=>{saveKPFields();nav('kp_result')});
    on('save-kp',()=>{saveKPFields();saveProposal();});
    document.querySelectorAll('[data-edit-zone]').forEach(el=>{
      el.addEventListener('click',e=>{
        if(e.target.closest('[data-del-zone],[data-move-zone]'))return;
        saveKPFields();
        state.currentZoneIdx=parseInt(el.dataset.editZone);
        nav('kp_build');
      });
    });
    document.querySelectorAll('[data-del-zone]').forEach(el=>{
      el.addEventListener('click',e=>{
        e.stopPropagation();
        if(confirm('Удалить зону?')){
          state.kp.zones.splice(parseInt(el.dataset.delZone),1);
          render();
        }
      });
    });
    document.querySelectorAll('[data-move-zone]').forEach(el=>{
      el.addEventListener('click',e=>{
        e.stopPropagation();
        const i=parseInt(el.dataset.zoneIdx);
        const j=el.dataset.moveZone==='up'?i-1:i+1;
        const z=state.kp.zones;
        if(j<0||j>=z.length)return;
        [z[i],z[j]]=[z[j],z[i]];
        render();
      });
    });
  }

  // ADD ZONE
  if(s==='kp_add_zone'){
    on('back-zones',()=>nav('kp_zones'));
    document.querySelectorAll('[data-zone-mode]').forEach(el=>{
      el.addEventListener('click',()=>{
        const mode=el.dataset.zoneMode;
        const name=document.getElementById('zone-name')?.value?.trim()||'Зона '+(state.kp.zones.length+1);
        const zone={id:genId(),name,mode,area:'',layers:[]};
        state.kp.zones.push(zone);
        state.currentZoneIdx=state.kp.zones.length-1;
        nav('kp_build');
      });
    });
  }

  // KP BUILD
  if(s==='kp_build'){
    on('back-zones',()=>{saveZoneFields();nav('kp_zones')});
    on('add-layer',()=>{state.addLayerCategory='primer';state.addLayerSearch='';nav('kp_add_layer')});
    on('done-zone',()=>{saveZoneFields();nav('kp_zones')});
    document.querySelectorAll('[data-del-layer]').forEach(el=>{
      el.addEventListener('click',()=>{
        const z=currentZone();if(!z)return;
        z.layers.splice(parseInt(el.dataset.delLayer),1);
        render();
      });
    });
    const areaInp=document.getElementById('zone-area');
    if(areaInp)areaInp.addEventListener('input',()=>{
      const z=currentZone();if(z)z.area=areaInp.value;render();
    });
    function saveZoneFields(){
      const z=currentZone();if(!z)return;
      const a=document.getElementById('zone-area');
      if(a)z.area=a.value;
    }
  }

  // ADD LAYER
  if(s==='kp_add_layer'){
    on('back-build',()=>nav('kp_build'));
    const searchInp=document.getElementById('layer-search');
    if(searchInp)searchInp.addEventListener('input',()=>{state.addLayerSearch=searchInp.value;render()});

    document.querySelectorAll('[data-cat]').forEach(el=>{
      el.addEventListener('click',()=>{state.addLayerCategory=el.dataset.cat;render()});
    });

    function saveCustomFormFields(){
      const cf=state.customForm;
      const g=id=>document.getElementById(id);
      cf.name=g('custom-name')?.value?.trim()||'';
      cf.fullName=g('custom-fullname')?.value?.trim()||'';
      cf.color=g('custom-color')?.value?.trim()||'';
      cf.cons=parseFloat(g('custom-cons')?.value)||0;
      cf.layers=parseFloat(g('custom-layers')?.value)||1;
      cf.price=parseFloat(g('custom-price')?.value)||0;
      cf.container=parseFloat(g('custom-cont')?.value)||0;
      cf.hardener=parseFloat(g('custom-hard')?.value)||0;
      cf.needed=parseFloat(g('custom-needed')?.value)||0;
      cf.category=g('custom-cat')?.value||cf.category||'custom';
    }

    document.querySelectorAll('[data-cf-unit]').forEach(el=>{
      el.addEventListener('click',()=>{saveCustomFormFields();state.customForm.unit=el.dataset.cfUnit;render()});
    });
    document.querySelectorAll('[data-cf-comp]').forEach(el=>{
      el.addEventListener('click',()=>{saveCustomFormFields();state.customForm.comp=el.dataset.cfComp;render()});
    });

    document.querySelectorAll('[data-add-prod]').forEach(el=>{
      el.addEventListener('click',()=>{
        const p=state.catalog.find(x=>x.id===el.dataset.addProd);
        if(!p)return;
        const z=currentZone();if(!z)return;
        const isList=z.mode==='list';
        if(isList){
          const needed=prompt(`Нужное количество (${p.unit==='l'?'л':'кг'}):`,'')||'';
          if(!needed)return;
          z.layers.push({productId:p.id,layers:1,category:p.category,neededAmount:parseFloat(needed)||0});
        } else {
          const layers=prompt('Количество слоёв:','1')||'1';
          z.layers.push({productId:p.id,layers:parseFloat(layers)||1,category:p.category});
        }
        nav('kp_build');
      });
    });

    function collectCustomLayer(){
      saveCustomFormFields();
      const cf=state.customForm;
      if(!cf.name){show('⚠️ Введите название');return null;}
      const z=currentZone();if(!z)return null;
      const isList=z.mode==='list';
      const is2c=cf.comp==='2c';const isL=cf.unit==='l';
      return{
        productId:null,layers:cf.layers||1,category:cf.category||'custom',
        customComp:cf.comp,customUnit:cf.unit,
        customName:cf.name,customFullName:cf.fullName||cf.name,
        customColor:cf.color||null,customPrice:cf.price||0,
        customConsumption:cf.cons||0,
        customContainer:cf.container||null,
        customHardener:(is2c&&!isL)?cf.hardener||3:null,
        neededAmount:isList?cf.needed||0:0,
      };
    }

    on('add-custom-kp',()=>{
      const layer=collectCustomLayer();if(!layer)return;
      const z=currentZone();if(!z)return;
      z.layers.push(layer);
      state.customForm={unit:'kg',comp:'1c'};
      nav('kp_build');show('✅ Добавлено в КП');
    });

    on('add-custom-catalog',()=>{
      const layer=collectCustomLayer();if(!layer)return;
      const cf=state.customForm;
      const is2c=cf.comp==='2c';const isL=cf.unit==='l';
      const product={
        id:genId(),category:cf.category||'custom',comp:cf.comp,unit:cf.unit,
        name:cf.name,fullName:cf.fullName||cf.name,color:cf.color||'',
        price:cf.price||0,consumption:cf.cons||0,comment:'',
        container:isL?(cf.container||10):(is2c?null:(cf.container||25)),
        base:(is2c&&!isL)?cf.container||18:null,
        hardener:(is2c&&!isL)?cf.hardener||3:null,
        updatedAt:Date.now(),
      };
      state.catalog.push(product);
      catalogDirty=true;
      const z=currentZone();if(!z)return;
      layer.productId=product.id;
      z.layers.push(layer);
      state.customForm={unit:'kg',comp:'1c'};
      persist();
      nav('kp_build');show('✅ Добавлено в КП и каталог');
      syncWithServer(false).catch(e=>console.warn(e));
    });
  }

  // KP RESULT
  if(s==='kp_result'){
    on('back-zones',()=>nav('kp_zones'));
    on('save-kp',()=>saveProposal());
    on('export-pdf',()=>exportPDF(state.kp,calcKP(),false));
    on('send-tg',()=>exportPDF(state.kp,calcKP(),true));
  }

  // PROPOSALS
  if(s==='proposals'){
    on('back-home',()=>nav('home'));
    document.querySelectorAll('[data-pid]').forEach(el=>{
      el.addEventListener('click',()=>{
        const p=state.proposals.find(x=>x.id===el.dataset.pid);
        if(p)nav('view_proposal',{viewProposal:p});
      });
    });
  }

  // VIEW PROPOSAL
  if(s==='view_proposal'){
    on('back-proposals',()=>nav('home'));
    on('edit-proposal',()=>{
      if(!state.viewProposal)return;
      state.kp=JSON.parse(JSON.stringify(state.viewProposal.kp||state.kp));
      state.editingProposalId=state.viewProposal.id;
      state.currentZoneIdx=null;
      nav('kp_zones');
    });
    on('export-saved',()=>{if(state.viewProposal)exportPDF(state.viewProposal.kp,state.viewProposal.result,false)});
    on('send-saved-tg',()=>{if(state.viewProposal)exportPDF(state.viewProposal.kp,state.viewProposal.result,true)});
    on('del-this',()=>{
      if(!confirm('Удалить это КП?'))return;
      const id=state.viewProposal?.id;
      state.proposals=state.proposals.filter(p=>p.id!==id);
      persist();
      nav('home');
      syncWithServer(false).catch(e=>console.warn(e));
    });
  }

  // CATALOG
  if(s==='catalog'){
    on('back-home',()=>nav('home'));
    on('add-product',()=>{
      state.editProduct={id:null,category:'primer',comp:'1c',unit:'kg',name:'',fullName:'',color:'',price:0,consumption:0,container:25,base:null,hardener:null,comment:''};
      nav('edit_product');
    });
    const cs=document.getElementById('cat-search');
    if(cs)cs.addEventListener('input',()=>{state.addLayerSearch=cs.value;render()});
    document.querySelectorAll('[data-cat]').forEach(el=>{
      el.addEventListener('click',()=>{state.addLayerCategory=el.dataset.cat;state.addLayerSearch='';render()});
    });
    document.querySelectorAll('[data-edit-prod]').forEach(el=>{
      el.addEventListener('click',()=>{
        const p=state.catalog.find(x=>x.id===el.dataset.editProd);
        if(p){state.editProduct=JSON.parse(JSON.stringify(p));nav('edit_product');}
      });
    });
  }

  // EDIT PRODUCT
  if(s==='edit_product'){
    on('back-catalog',()=>nav('catalog'));
    document.querySelectorAll('[data-ecat]').forEach(el=>{
      el.addEventListener('click',()=>{state.editProduct.category=el.dataset.ecat;render()});
    });
    document.querySelectorAll('[data-eunit]').forEach(el=>{
      el.addEventListener('click',()=>{state.editProduct.unit=el.dataset.eunit;render()});
    });
    document.querySelectorAll('[data-ecomp]').forEach(el=>{
      el.addEventListener('click',()=>{state.editProduct.comp=el.dataset.ecomp;render()});
    });
    on('save-product',()=>{
      const g=id=>document.getElementById(id);
      const p=state.editProduct;
      p.name=g('ep-name')?.value?.trim()||'';
      p.fullName=g('ep-fullname')?.value?.trim()||p.name;
      p.color=g('ep-color')?.value?.trim()||'';
      p.price=parseFloat(g('ep-price')?.value)||0;
      p.consumption=parseFloat(g('ep-cons')?.value)||0;
      const cont=parseFloat(g('ep-cont')?.value)||0;
      const hard=parseFloat(g('ep-hard')?.value)||0;
      const is2c=p.comp==='2c';const isL=p.unit==='l';
      p.container=isL?cont:(is2c?null:cont);
      p.base=(is2c&&!isL)?cont:null;
      p.hardener=(is2c&&!isL)?hard:null;
      p.comment=g('ep-comment')?.value?.trim()||'';
      p.updatedAt=Date.now();
      if(!p.name){show('⚠️ Введите название');return;}
      if(!p.id){p.id=genId();state.catalog.push(p);}
      else{const idx=state.catalog.findIndex(x=>x.id===p.id);if(idx>=0)state.catalog[idx]=p;}
      catalogDirty=true;
      persist();
      nav('catalog');show('✅ Сохранено');
      syncWithServer(false).catch(e=>console.warn(e));
    });
    on('del-product',()=>{
      if(!confirm('Удалить материал?'))return;
      state.catalog=state.catalog.filter(x=>x.id!==state.editProduct.id);
      catalogDirty=true;persist();nav('catalog');show('Удалено');
      syncWithServer(false).catch(e=>console.warn(e));
    });
  }
}

// ===== SAVE KP FIELDS =====
function saveKPFields(){
  const d=document.getElementById('kp-delivery');
  const n=document.getElementById('kp-note');
  if(d)state.kp.delivery=parseFloat(d.value)||0;
  if(n)state.kp.note=n.value;
}

// ===== SAVE PROPOSAL =====
function saveProposal(){
  const r=calcKP();
  const now=Date.now();
  if(state.editingProposalId){
    const idx=state.proposals.findIndex(p=>p.id===state.editingProposalId);
    const pr={id:state.editingProposalId,name:state.kp.name||'Без названия',
      zoneCount:state.kp.zones.length,total:r.total,date:now,updatedAt:now,
      result:r,kp:JSON.parse(JSON.stringify(state.kp))};
    if(idx>=0)state.proposals[idx]=pr;else state.proposals.push(pr);
    state.editingProposalId=null;
    show('✅ КП обновлено!');
  } else {
    const pr={id:genId(),name:state.kp.name||'Без названия',
      zoneCount:state.kp.zones.length,total:r.total,date:now,updatedAt:now,
      result:r,kp:JSON.parse(JSON.stringify(state.kp))};
    state.proposals.push(pr);
    show('✅ КП сохранено!');
  }
  persist();
  syncWithServer(false).catch(e=>console.warn(e));
}

// ===== PDF =====
async function exportPDF(kp,result,sendToTelegram){
  show('⏳ Генерация PDF...');
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210,M=15,CW=W-M*2;

    // Header
    doc.setFillColor(30,34,53);doc.rect(0,0,W,35,'F');
    doc.setFontSize(20);doc.setTextColor(108,99,255);
    doc.text('ЗАВОД НЕВА',M,18);
    doc.setFontSize(9);doc.setTextColor(160,164,184);
    doc.text(`Дата: ${new Date().toLocaleDateString('ru-RU')}`,W-M,12,{align:'right'});
    doc.setFontSize(16);doc.setTextColor(240,240,240);
    doc.text(kp.name||'Коммерческое предложение',M,28);

    let y=45;
    doc.setFontSize(10);doc.setTextColor(30,34,53);

    for(const zone of result.zones){
      // Zone header
      doc.setFillColor(42,47,69);doc.rect(M,y,CW,8,'F');
      doc.setTextColor(240,240,240);doc.setFontSize(10);doc.setFont(undefined,'bold');
      const zoneTitle=zone.name+(zone.area?` — ${zone.area} м²`:'');
      doc.text(zoneTitle,M+3,y+5.5);
      y+=10;

      const tableBody=zone.layers.map(l=>[
        l.fullName||l.name,
        l.color||'',
        l.detail||'',
        fmtRub(l.total)
      ]);

      doc.autoTable({
        startY:y,
        head:[['Материал','Цвет','Кол-во × тара','Сумма']],
        body:tableBody,
        margin:{left:M,right:M},
        styles:{fontSize:9,cellPadding:3,textColor:[30,34,53]},
        headStyles:{fillColor:[108,99,255],textColor:[255,255,255],fontStyle:'bold'},
        alternateRowStyles:{fillColor:[245,245,250]},
        columnStyles:{0:{cellWidth:75},1:{cellWidth:30},2:{cellWidth:45},3:{cellWidth:30,halign:'right'}},
      });
      y=doc.lastAutoTable.finalY+4;

      // Zone total
      doc.setFillColor(42,47,69);doc.rect(M,y,CW,7,'F');
      doc.setTextColor(46,204,113);doc.setFont(undefined,'bold');
      doc.text('Итого зона:',M+3,y+5);
      doc.text(fmtRub(zone.total),W-M-3,y+5,{align:'right'});
      y+=10;

      if(y>260){doc.addPage();y=20;}
    }

    if(result.delivery){
      doc.setTextColor(30,34,53);doc.setFont(undefined,'normal');
      doc.text(`Доставка: ${fmtRub(result.delivery)}`,M,y+5);y+=10;
    }

    // Grand total
    doc.setFillColor(108,99,255);doc.rect(M,y,CW,12,'F');
    doc.setFontSize(14);doc.setTextColor(255,255,255);doc.setFont(undefined,'bold');
    doc.text('ИТОГО:',M+5,y+8.5);
    doc.text(fmtRub(result.total),W-M-5,y+8.5,{align:'right'});

    if(kp.note){
      y+=18;doc.setFontSize(9);doc.setTextColor(100,100,100);doc.setFont(undefined,'normal');
      doc.text('Примечание: '+kp.note,M,y,{maxWidth:CW});
    }

    if(sendToTelegram){
      const pdfB64=doc.output('datauristring').split(',')[1];
      const pin=localStorage.getItem(PIN_KEY)||state.pin;
      const chatId=tg?.initDataUnsafe?.user?.id||state.userId;
      const r=await fetch(`${API}/send-pdf`,{
        method:'POST',
        headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
        body:JSON.stringify({pin,chat_id:chatId,pdf:pdfB64,filename:`КП_${kp.name||'Завод_Нева'}.pdf`})
      });
      if(r.ok){show('✅ PDF отправлен в Telegram!');}
      else{show('❌ Ошибка отправки');console.error(await r.text());}
    } else {
      doc.save(`КП_${kp.name||'Завод_Нева'}_${new Date().toLocaleDateString('ru-RU')}.pdf`);
      show('✅ PDF скачан!');
    }
  }catch(e){show('❌ Ошибка PDF: '+e.message);console.error(e);}
}

// ===== INIT =====
const cached=load();
if(cached){state.catalog=cached.catalog||[];state.proposals=cached.proposals||[];}
render();
</script>
